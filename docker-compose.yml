services:
  postgres:
    image: postgres:16-alpine
    container_name: campusgate_postgres
    environment:
      POSTGRES_DB: campusgate
      POSTGRES_USER: campusgate
      POSTGRES_PASSWORD: campusgate_dev_password
    ports:
      - "5433:5432"
    volumes:
      - campusgate_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusgate -d campusgate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  campusgate_postgres_data:
